<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Project Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<main class="project-detail-page">
    <section class="project-detail-hero show">
        <div class="project-detail-media">
            <img th:src="@{${project.image}}" th:alt="${project.title}">
        </div>

        <div class="project-detail-copy">
            <a th:href="@{/#projects}" class="project-back-link">
                <i class="bx bx-arrow-back"></i>
                Back to projects
            </a>
            <span class="project-type-badge project-type-badge-detail" th:text="${project.type}">mobile</span>
            <h1 th:text="${project.title}">Project Title</h1>
            <p class="project-detail-description" th:text="${project.description}">Project description</p>
            <a class="project-github-link"
               th:if="${project.githubUrl != null and !#strings.isEmpty(project.githubUrl)}"
               th:href="${project.githubUrl}"
               href="#"
               target="_blank"
               rel="noreferrer">
                <i class="bx bxl-github"></i>
                View source on GitHub
            </a>

            <div class="project-detail-panel" th:if="${project.impact != null and !#strings.isEmpty(project.impact)}">
                <h2>Impact</h2>
                <p th:text="${project.impact}">Project impact</p>
            </div>

            <div class="project-detail-panel" th:if="${project.highlights != null and !#lists.isEmpty(project.highlights)}">
                <h2>Highlights</h2>
                <ul class="project-detail-list">
                    <li th:each="highlight : ${project.highlights}" th:text="${highlight}">Highlight</li>
                </ul>
            </div>

            <div class="project-detail-panel" th:if="${project.techStack != null and !#lists.isEmpty(project.techStack)}">
                <h2>Tech Stack</h2>
                <div class="project-tech-list">
                    <span th:each="tech : ${project.techStack}" th:text="${tech}">Tech</span>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
